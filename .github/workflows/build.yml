name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash   # implies -eo pipefail, so `| tee` cannot mask a failed build

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS build & test
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          swift --version

      - name: Build (debug)
        run: swift build 2>&1 | tee build.log

      - name: Test
        run: swift test 2>&1 | tee test.log

      - name: Build .app bundle (release, ad-hoc signed)
        run: ./scripts/build-app.sh

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Spruce-app
          path: build/Spruce.zip
          if-no-files-found: error

  linux-core:
    name: Linux core tests
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Test core
        run: swift test
